<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiSalud — Bienvenida</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --verde: #22C55E;
  --verde-claro: #DCFCE7;
  --verde-texto: #15803D;
  --rojo: #FEE2E2;
  --rojo-texto: #DC2626;
  --gris-bg: #F0FDF4;
  --gris-borde: #D1FAE5;
  --gris-texto: #64748B;
  --negro: #0F172A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito Sans', sans-serif;
  background: var(--gris-bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.card {
  background: #fff;
  border-radius: 28px;
  padding: 40px 36px;
  width: 100%;
  max-width: 400px;
  border: 1px solid var(--gris-borde);
  text-align: center;
}

.logo-wrap {
  margin-bottom: 28px;
}
.logo-icon {
  width: 72px; height: 72px;
  background: var(--verde);
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  margin: 0 auto 14px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}
.logo-nombre {
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  font-size: 32px;
  color: var(--negro);
  letter-spacing: -0.5px;
}
.logo-slogan {
  font-size: 14px;
  color: var(--gris-texto);
  margin-top: 4px;
}

.titulo {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 20px;
  color: var(--negro);
  margin-bottom: 6px;
}
.subtitulo {
  font-size: 14px;
  color: var(--gris-texto);
  margin-bottom: 32px;
  line-height: 1.6;
}

/* CÓDIGO DE 6 DÍGITOS */
.codigo-wrap {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 10px;
}
.digito {
  width: 52px; height: 64px;
  border: 2.5px solid #E2E8F0;
  border-radius: 14px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 28px;
  color: var(--negro);
  text-align: center;
  background: #F8FAFC;
  transition: all 0.15s;
  caret-color: var(--verde);
  -webkit-appearance: none;
}
.digito:focus {
  outline: none;
  border-color: var(--verde);
  background: #fff;
  transform: scale(1.05);
}
.digito.lleno {
  border-color: var(--verde);
  background: var(--verde-claro);
  color: var(--verde-texto);
}
.digito.error-anim {
  border-color: #DC2626;
  background: var(--rojo);
  animation: shake 0.4s ease;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

.error-msg {
  font-size: 13px;
  color: var(--rojo-texto);
  min-height: 20px;
  margin-bottom: 8px;
  font-weight: 600;
}

.btn-entrar {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: none;
  background: var(--verde);
  color: #fff;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-entrar:hover { background: #16A34A; transform: translateY(-1px); }
.btn-entrar:active { transform: translateY(0); }
.btn-entrar:disabled { background: #D1D5DB; cursor: not-allowed; transform: none; }

/* PANTALLA DE BIENVENIDA */
.bienvenida {
  display: none;
  animation: fadeIn 0.5s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.avatar-grande {
  width: 80px; height: 80px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 28px;
  margin: 0 auto 16px;
}

.saludo-nombre {
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  font-size: 26px;
  color: var(--negro);
  margin-bottom: 6px;
}
.saludo-sub {
  font-size: 14px;
  color: var(--gris-texto);
  margin-bottom: 24px;
  line-height: 1.6;
}

.condiciones-lista {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin-bottom: 28px;
}
.cond-tag {
  font-size: 12px;
  background: var(--verde-claro);
  color: var(--verde-texto);
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 600;
}

.btn-continuar {
  width: 100%;
  padding: 18px;
  border-radius: 16px;
  border: none;
  background: var(--verde);
  color: #fff;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-continuar:hover { background: #16A34A; }

.footer {
  margin-top: 28px;
  font-size: 12px;
  color: #94A3B8;
  line-height: 1.8;
}

/* LOADING */
.loading {
  display: inline-block;
  width: 18px; height: 18px;
  border: 2.5px solid rgba(255,255,255,0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 420px) {
  .card { padding: 32px 20px; border-radius: 20px; }
  .digito { width: 44px; height: 56px; font-size: 24px; }
  .codigo-wrap { gap: 7px; }
}
</style>
<script src="firebase.js"></script>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22C55E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MiSalud">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js')
        .then(function () { console.log('[MiSalud] service worker OK'); })
        .catch(function (e) { console.warn('[MiSalud] service worker falló:', e); });
    });
  }
</script>
</head>
<body>

<div class="card" id="card-login">
  <div class="logo-wrap">
    <div class="logo-icon">💚</div>
    <div class="logo-nombre">MiSalud</div>
    <div class="logo-slogan">Tu compañero de salud familiar</div>
  </div>

  <div class="titulo">Ingresa tu código</div>
  <div class="subtitulo">
    Escribe los 6 números que te envió<br>Natalia por WhatsApp
  </div>

  <div class="codigo-wrap" id="codigo-wrap">
    <input class="digito" id="d0" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
    <input class="digito" id="d1" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
    <input class="digito" id="d2" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
    <input class="digito" id="d3" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
    <input class="digito" id="d4" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
    <input class="digito" id="d5" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
  </div>

  <div class="error-msg" id="error-msg"></div>

  <button class="btn-entrar" id="btn-entrar" onclick="verificarCodigo()" disabled>
    Entrar
  </button>

  <div class="footer">
    ¿Perdiste tu código?<br>
    Escríbele a Natalia por WhatsApp y ella te lo reenvía.
  </div>
</div>

<div class="card bienvenida" id="card-bienvenida">
  <div id="bienvenida-contenido"></div>
</div>

<script>
const COLORES_AVATAR = [
  ['#DBEAFE','#1D4ED8'],['#DCFCE7','#15803D'],['#FCE7F3','#9D174D'],
  ['#FEF9C3','#854D0E'],['#EDE9FE','#5B21B6'],['#FFEDD5','#9A3412']
];

function iniciales(nombre) {
  return nombre.split(' ').filter(Boolean).map(p => p[0]).join('').substring(0,2).toUpperCase();
}

function colorAvatar(idx) {
  return COLORES_AVATAR[idx % COLORES_AVATAR.length];
}

function horaDelDia() {
  const h = new Date().getHours();
  if (h >= 6 && h < 12) return 'Buenos días';
  if (h >= 12 && h < 20) return 'Buenas tardes';
  return 'Buenas noches';
}

// ── AUTO-LOGIN: si ya hay sesión activa, ir directo al home ──
const _sesionActiva = JSON.parse(localStorage.getItem('misalud_usuario_actual') || 'null');
if (_sesionActiva) {
  window.location.href = 'home.html';
}

// Firebase cargado via tag en head

// Configurar inputs de dígitos
const digitos = Array.from({length: 6}, (_, i) => document.getElementById('d' + i));

digitos.forEach((input, i) => {
  input.addEventListener('input', e => {
    const val = e.target.value.replace(/\D/g, '');
    input.value = val ? val[val.length - 1] : '';
    input.classList.toggle('lleno', !!input.value);
    limpiarError();

    if (input.value && i < 5) {
      digitos[i + 1].focus();
    }
    actualizarBoton();
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !input.value && i > 0) {
      digitos[i - 1].focus();
      digitos[i - 1].value = '';
      digitos[i - 1].classList.remove('lleno');
      actualizarBoton();
    }
    if (e.key === 'Enter') verificarCodigo();
  });

  // Permitir pegar el código completo
  input.addEventListener('paste', e => {
    e.preventDefault();
    const texto = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
    if (texto.length >= 6) {
      digitos.forEach((d, j) => {
        d.value = texto[j] || '';
        d.classList.toggle('lleno', !!d.value);
      });
      digitos[5].focus();
      actualizarBoton();
    }
  });
});

digitos[0].focus();

function actualizarBoton() {
  const completo = digitos.every(d => d.value);
  document.getElementById('btn-entrar').disabled = !completo;
}

function limpiarError() {
  document.getElementById('error-msg').textContent = '';
  digitos.forEach(d => d.classList.remove('error-anim'));
}

function mostrarError(msg) {
  document.getElementById('error-msg').textContent = msg;
  digitos.forEach(d => {
    d.classList.add('error-anim');
    setTimeout(() => d.classList.remove('error-anim'), 500);
  });
  digitos[0].focus();
  digitos.forEach(d => { d.value = ''; d.classList.remove('lleno'); });
  actualizarBoton();
}

async function verificarCodigo() {
  const codigo = digitos.map(d => d.value).join('');
  if (codigo.length < 6) return;

  const btn = document.getElementById('btn-entrar');
  btn.innerHTML = '<span class="loading"></span>';
  btn.disabled = true;

  // Buscar en Firebase primero, fallback a localStorage
  let perfil = null;
  try {
    perfil = await fbBuscarPorCodigo(codigo);
  } catch(e) {
    // Firebase no disponible — usar localStorage
    const perfiles = JSON.parse(localStorage.getItem('misalud_perfiles') || '[]');
    perfil = perfiles.find(p => p.codigo === codigo && p.activo) || null;
  }

  // Si no encontró en Firebase, intentar localStorage
  if (!perfil) {
    const perfiles = JSON.parse(localStorage.getItem('misalud_perfiles') || '[]');
    perfil = perfiles.find(p => p.codigo === codigo && p.activo) || null;
  }

  if (perfil) {
    localStorage.setItem('misalud_usuario_actual', JSON.stringify(perfil));
    const perfiles = JSON.parse(localStorage.getItem('misalud_perfiles') || '[]');
    const idx = Math.max(0, perfiles.findIndex(p => p.codigo === codigo));
    mostrarBienvenida(perfil, idx);
  } else {
    btn.innerHTML = 'Entrar';
    btn.disabled = false;
    mostrarError('Código incorrecto. Verifica los números e intenta de nuevo.');
  }
}

function mostrarBienvenida(perfil, idx) {
  const [bgAv, textAv] = colorAvatar(idx);
  const saludo = horaDelDia();

  document.getElementById('card-login').style.display = 'none';
  const cardB = document.getElementById('card-bienvenida');
  cardB.style.display = 'block';

  const condMostrar = perfil.condiciones.slice(0, 5);
  const resto = perfil.condiciones.length - 5;

  document.getElementById('bienvenida-contenido').innerHTML = `
    <div class="avatar-grande" style="background:${bgAv};color:${textAv}">
      ${iniciales(perfil.nombre)}
    </div>
    <div class="saludo-nombre">${saludo},<br>${perfil.nombre.split(' ')[0]} 👋</div>
    <div class="saludo-sub">
      Tu perfil está listo.<br>Puedes empezar a registrar cómo te sientes.
    </div>
    ${condMostrar.length > 0 ? `
    <div class="condiciones-lista">
      ${condMostrar.map(c => `<span class="cond-tag">${c}</span>`).join('')}
      ${resto > 0 ? `<span class="cond-tag">+${resto} más</span>` : ''}
    </div>` : ''}
    <button class="btn-continuar" onclick="irAlHome()">
      Ir a MiSalud →
    </button>
  `;
}

function irAlHome() {
  window.location.href = 'home.html';
}
</script>
</body>
</html>
